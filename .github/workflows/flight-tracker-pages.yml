name: Deploy flight tracker to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'flight-tracker/**'
      - 'evidence/example-output.json'
      - '.github/workflows/flight-tracker-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare the static dashboard
        env:
          FLIGHT_TRACKER_API_URL: ${{ vars.FLIGHT_TRACKER_API_URL }}
        run: node flight-tracker/build-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact
      - uses: actions/deploy-pages@v4
        id: deployment
